falc.account.name=DevAPI
falc.account.version=0.6.0adev

# this causes an exception when debugging so set it to a high value
#spring.datasource.hikari.leakDetectionThreshold=1000000

# Should only be when h2 profile is active. Requires a data-h2.sql in the production resources
# directory which is not ideal, should try to find a way to run the DEV-H2 configuration
# as a test application with the test resources...
falc.account.db=H2MEM
falc.account.db.username=sa
falc.account.db.password=password

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

spring.sql.init.platform=h2
spring.sql.init.mode=always

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.name=testdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
